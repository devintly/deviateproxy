name: Сборка расширения

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
      - "*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Собрать zip/xpi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tests
        run: |
          node scripts/test-host-rules.js
          node scripts/test-own-pages.js
          node scripts/test-list-ingest.js
          node scripts/test-list-update.js
          node scripts/test-proxy-info.js
          node scripts/test-generate-pac.js
          node scripts/test-pac-parse.js
          node scripts/test-routing-parity.js
          node scripts/test-background-contracts.js
          node scripts/test-list-store.js
          node scripts/test-settings-io.js
          node scripts/test-i18n-keys.js

      - name: Package
        run: python3 scripts/package.py

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: deviateproxy-packages
          path: |
            dist/*.zip
            dist/*.xpi
          if-no-files-found: error

      - name: Upload unpacked extensions
        uses: actions/upload-artifact@v7
        with:
          name: deviateproxy-unpacked
          path: dist/unpacked/
          if-no-files-found: error

  release:
    name: Опубликовать релиз
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh --generate-notes читает историю тегов, без checkout падает с "not a git repository".
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: deviateproxy-packages
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          files=(dist/*.zip dist/*.xpi)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "В dist нет zip/xpi"
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "v${ver}" --generate-notes --verify-tag
          fi
          gh release edit "$tag" --draft=false --latest
          gh release upload "$tag" "${files[@]}" --clobber
          gh release view "$tag" --json url,tagName,isDraft,isPrerelease
